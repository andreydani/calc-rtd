[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-rtd"
dynamic = ["version"]
description = "Use Excel RTD (RealTimeData) servers from Python and from LibreOffice Calc"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["comtypes>=1.2; sys_platform == 'win32'"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 4 - Beta",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://andreydani.github.io/calc-rtd/"
Source = "https://github.com/andreydani/calc-rtd"
Issues = "https://github.com/andreydani/calc-rtd/issues"

[project.scripts]
calc-rtd-bridge = "calc_rtd_bridge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "calc_rtd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
