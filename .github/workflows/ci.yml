name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - name: Install pandas (one job runs the pandas example)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pip install pandas
      - name: Build and register the sample RTD server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./samples/rtd-server/build.ps1 -Arch x64
          "CALC_RTD_SAMPLE_SERVER=1" >> $env:GITHUB_ENV
      - run: python -m pytest -v -rs

  libreoffice:
    name: End to end with LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno python3-pip
      - name: Install bridge and extension
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          /usr/bin/python3 tools/build_oxt.py
          unopkg add -f dist/calc-rtd.oxt
      - name: Run
        run: /usr/bin/python3 tests/integration_libreoffice.py

  libreoffice-windows:
    name: End to end with LibreOffice on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install . pyinstaller
      - name: Build the win64 extension with the bundled bridge
        run: |
          pyinstaller --onefile --console --name calc-rtd-bridge tools/bridge_entry.py
          python tools/build_oxt.py --bridge-exe dist/calc-rtd-bridge.exe --output oxt/calc-rtd-win64.oxt
      - name: Install LibreOffice
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          $lo = "C:\Program Files\LibreOffice\program"
          "LibreOffice " + (Get-Item "$lo\soffice.exe").VersionInfo.ProductVersion
          & "$lo\python.exe" -c "import sys; print('bundled Python', sys.version)"
          "LO_PROGRAM=$lo" >> $env:GITHUB_ENV
      - name: Install the extension
        shell: pwsh
        run: '& "$env:LO_PROGRAM\unopkg.com" add -f oxt\calc-rtd-win64.oxt'
      - name: Run
        shell: pwsh
        env:
          CALC_RTD_BUNDLED: "1"
        run: |
          $env:PATH = "$env:LO_PROGRAM;$env:PATH"
          $env:BRIDGE_PYTHON = (Get-Command python).Source
          & "$env:LO_PROGRAM\python.exe" tests\integration_libreoffice.py
          exit $LASTEXITCODE

  package:
    name: Python package and plain extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python tools/build_oxt.py --print-version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in src/calc_rtd/__init__.py"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build --outdir pypi-dist
      - run: python tools/build_oxt.py --output oxt/calc-rtd.oxt
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: pypi-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: oxt-plain
          path: oxt/

  bundle:
    name: Extension with bundled bridge (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, label: win64 }
          - { arch: x86, label: win32 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - run: python -m pip install . pyinstaller
      - name: Build standalone bridge
        run: pyinstaller --onefile --console --name calc-rtd-bridge tools/bridge_entry.py
      - name: Smoke test the executable
        run: |
          dist\calc-rtd-bridge.exe --version
          dist\calc-rtd-bridge.exe -v monitor --progid calcrtd.sim --topics counter 0.2 --seconds 2
      - name: Test the executable against a real RTD server
        shell: pwsh
        run: |
          ./samples/rtd-server/build.ps1 -Arch ${{ matrix.arch }}
          dist\calc-rtd-bridge.exe -v monitor "=RTD(CalcRtd.Sample;;counter)" "=RTD(CalcRtd.Sample;;echo;hello)" --seconds 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Repeat: a crash at process exit would show up as a non-zero exit code only now and then.
          foreach ($attempt in 1..6) {
            dist\calc-rtd-bridge.exe monitor "=RTD(CalcRtd.Sample;;counter)" --seconds 1.5 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "attempt $attempt exited with $LASTEXITCODE"; exit 1 }
          }
      - name: Build extension
        run: python tools/build_oxt.py --bridge-exe dist/calc-rtd-bridge.exe --output oxt/calc-rtd-${{ matrix.label }}.oxt
      - uses: actions/upload-artifact@v4
        with:
          name: oxt-${{ matrix.label }}
          path: oxt/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, libreoffice, libreoffice-windows, package, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oxt-*
          path: oxt
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when the tag was created from the GitHub web page.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" oxt/*.oxt --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, libreoffice, libreoffice-windows, package, bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
